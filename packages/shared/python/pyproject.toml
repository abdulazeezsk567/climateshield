[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "climateshield-shared"
version = "0.1.0"
description = "Shared cross-service data schemas and contracts for ClimateShield"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["climateshield_shared*"]
