name: ClimateShield CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. SECURITY & SECRETS HYGIENE GATE
  # ============================================================================
  secrets-hygiene:
    name: Secrets & Credentials Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Automated Secrets Scanner
        run: python scripts/check_secrets.py

  # ============================================================================
  # 2. BACKEND LINT, VULNERABILITY SCAN & PYTEST SUITE
  # ============================================================================
  backend-ci:
    name: Backend Quality & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pip-audit pytest
          pip install -e packages/shared/python
          pip install -e data-layer
          pip install -e risk-engine
          pip install -e integration-layer
          pip install -e api

      - name: Syntax & Import Linter (Flake8)
        run: |
          # Stop build on syntax errors, undefined names, or severe Python defects
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Dependency Vulnerability Audit (pip-audit)
        run: |
          # Scan dependencies for known CVEs
          pip-audit --desc on || echo "pip-audit completed check."

      - name: Run Backend Pytest Suite
        env:
          ENVIRONMENT: development
          JWT_SECRET_KEY: test-insecure-secret-key-for-ci-only
        run: |
          pytest api/tests risk-engine/tests data-layer/tests integration-layer/tests -v --maxfail=1

  # ============================================================================
  # 3. FRONTEND TYPECHECK, AUDIT & VITEST SUITE
  # ============================================================================
  frontend-ci:
    name: Frontend Quality & Automated Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Modules
        run: npm ci

      - name: Dependency Vulnerability Scan (npm audit)
        run: |
          # Fails the pipeline on critical security vulnerabilities
          npm audit --audit-level=critical

      - name: Run Frontend Vitest Suite
        run: npm test

      - name: TypeScript Compilation & Production Build
        run: npm run build

  # ============================================================================
  # 4. DOCKER COMPOSE CONFIGURATION SYNTAX CHECK
  # ============================================================================
  docker-compose-validation:
    name: Dockerfile & Compose Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
